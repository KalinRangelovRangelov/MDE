<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#2b6fb5"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe0f2"/>
      <stop offset="1" stop-color="#9bbbdc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1d2a3a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Paper sheet with a folded top-right corner -->
  <g filter="url(#shadow)">
    <path d="M250 96
             h372
             l152 152
             v680
             a32 32 0 0 1 -32 32
             H250
             a32 32 0 0 1 -32 -32
             V128
             a32 32 0 0 1 32 -32 Z"
          fill="#ffffff" stroke="#d8dee6" stroke-width="4"/>
    <!-- the fold -->
    <path d="M622 96 l152 152 H654 a32 32 0 0 1 -32 -32 Z" fill="url(#fold)"/>
  </g>

  <!-- Brand mark: blue rounded panel with white "M" + up arrow -->
  <g transform="translate(512 560)">
    <rect x="-176" y="-150" width="352" height="240" rx="34" fill="url(#brand)"/>
    <rect x="-176" y="-150" width="352" height="240" rx="34" fill="none" stroke="#ffffff" stroke-width="22"/>
    <!-- M -->
    <path d="M-104 36 V-70 h34 l40 70 40 -70 h34 V36 h-34 V-14 l-40 66 -40 -66 V36 Z"
          fill="#ffffff"/>
  </g>
  <!-- up arrow stem under the panel, echoing the app icon -->
  <g transform="translate(512 560)" fill="#2b6fb5">
    <path d="M0 96 l-72 78 h44 v70 h56 v-70 h44 Z"/>
  </g>

  <!-- ".md" wordmark -->
  <text x="512" y="868" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="92" fill="#2b6fb5" letter-spacing="2">.md</text>
</svg>
